services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rolefit"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=rolefit
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=rolefit
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql/:/docker-entrypoint-initdb.d/
  
  redis:
    image: redis:7-alpine        
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: