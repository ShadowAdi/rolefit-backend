services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./run_celery_worker.py:/app/run_celery_worker.py
    command: python run_celery_worker.py

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rolefit"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=rolefit
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=rolefit
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql/:/docker-entrypoint-initdb.d/

  # Redis now runs on Upstash (external managed Redis). To go back to a local
  # Redis, uncomment this service, re-add `redis` under each service's
  # depends_on, restore the redis_data volume, and switch the REDIS_URL /
  # REDIS_CELERY_URL values in .env back to the redis://redis:6379/... ones.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data: